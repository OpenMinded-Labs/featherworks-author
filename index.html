<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Featherworks Author</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { --fw-bg:#f5f7fa; --fw-fg:#222; --fw-accent:#4a90e2; }
      html,body { height:100%; }
      body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--fw-bg); color:var(--fw-fg); -webkit-font-smoothing:antialiased; }
      #root { min-height:100%; }
      .fw-fallback, .fw-early { font:13px ui-monospace; padding:14px 18px; background:#fff5f1; color:#7a1400; border:1px solid #f3b199; border-radius:10px; max-width:640px; margin:48px auto; box-shadow:0 4px 12px -4px rgba(0,0,0,.12); }
      .fw-fallback strong { font-size:14px; }
      .fw-hidden { display:none !important; }
    </style>
    <script>
      // EARLY DIAGNOSTICS (runs before module graph)
      window.__FW_INDEX = 'root-index.html';
      (function(){
        const root = document.addEventListener ? document.addEventListener('DOMContentLoaded', install) : install();
        function install(){
          const r = document.getElementById('root');
          if(!r) return;
          const early = document.createElement('div');
          early.className='fw-early';
          early.id='fw-early-msg';
          early.innerHTML='<strong>Bootstrapping UI…</strong><br><span id="fw-phase">Lade Module</span>';
          r.appendChild(early);
          window.__fwPhase = function(p){ const el=document.getElementById('fw-phase'); if(el) el.textContent=p; };
        }
        window.addEventListener('error', function(e){
          const r=document.getElementById('root'); if(!r) return;
          let box=document.getElementById('fw-fallback');
          if(!box){ box=document.createElement('div'); box.id='fw-fallback'; box.className='fw-fallback'; r.appendChild(box); }
          box.innerHTML='<strong>Renderer Fehler</strong><br>'+ (e.message||e)+'<br><small>'+ (e.filename? (e.filename+':'+e.lineno):'') +'</small>';
        });
        window.addEventListener('unhandledrejection', function(e){
          const r=document.getElementById('root'); if(!r) return;
          let box=document.getElementById('fw-fallback');
          if(!box){ box=document.createElement('div'); box.id='fw-fallback'; box.className='fw-fallback'; r.appendChild(box); }
          box.innerHTML='<strong>Unhandled Promise Rejection</strong><br>'+ (e.reason && e.reason.message? e.reason.message : e.reason);
        });
        setTimeout(function(){
          const r=document.getElementById('root');
          if(!r) return;
            if(!r.firstElementChild || (r.firstElementChild && r.firstElementChild.id==='fw-early-msg')){
              let box=document.getElementById('fw-fallback');
              if(!box){ box=document.createElement('div'); box.id='fw-fallback'; box.className='fw-fallback'; r.appendChild(box); }
              box.innerHTML='[Featherworks] React hat nach 1500ms nicht gemountet.<br>Öffne DevTools (Alt+Cmd+I) und schau Console. index='+window.__FW_INDEX+' phase='+(window.__fwPhase? 'known':'unknown');
            }
        }, 1500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>window.__fwPhase && window.__fwPhase('Starte React');</script>
    <script type="module">
      window.__fwPhase && window.__fwPhase('Import main.tsx');
      import './src/frontend/main.tsx';
    </script>
  </body>
</html>
